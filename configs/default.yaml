data:
  name: gowalla
  data_dir: data
  batch_size: 2048
  num_workers: 4

complex:
  tau: 20
  gamma: 0.5
  cache_dir: data/complex_cache

model:
  name: lightgcn
  embed_dim: 64
  n_layers: 3
  dropout: 0.0
  # NGCF-specific
  node_dropout: 0.1
  message_dropout: 0.1
  # SGL-specific
  ssl_weight: 0.1
  ssl_temp: 0.2
  augment_type: edge_dropout
  augment_ratio: 0.1
  # LightCCN-Multi specific
  edge_embed_dim: 64
  face_embed_dim: 64

train:
  epochs: 1000
  lr: 0.001
  reg_weight: 0.0001
  early_stop_patience: 50
  eval_every: 10
  seed: 2020
  device: cuda

eval:
  topk: [10, 20, 50]
  eval_batch_size: 1024
  primary_metric: recall
  primary_k: 20

checkpoint_dir: checkpoints
results_dir: results
