[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "light-ccn"
version = "0.1.0"
description = "LightCCN: Lightweight Cell Complex Networks for Collaborative Filtering"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "scipy>=1.10",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "tqdm>=4.65",
    "pandas>=2.0",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
